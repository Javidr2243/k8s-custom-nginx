version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: uv
    directory: /pipeline
    schedule: { interval: weekly }
    groups:
      pipeline: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
