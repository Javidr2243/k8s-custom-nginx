# Official sources for ¿A dónde va tu dinero? MTY.
# - Every file the app uses is listed here with its URL and the page that links to it.
# - dominios_permitidos is the download allowlist (re-checked after every redirect).
# - faltantes_conocidos documents periods that have no machine-readable data, and why.
# Changes to this file need owner review (CODEOWNERS).
version: 1
periodo_inicial: 2023T1
dominios_permitidos:
- www.monterrey.gob.mx
- transparencia.sanpedro.gob.mx
- www.stacatarina.gob.mx
- www.inegi.org.mx
- gaia.inegi.org.mx
- www.disciplinafinanciera.hacienda.gob.mx
- licitaciones.sanpedro.gob.mx
faltantes_conocidos:
- municipio: san-pedro
  periodo: 2024T4
  motivo: El municipio no publicó el formato NLA95FXXIIB de este trimestre en su portal de transparencia.
- municipio: santa-catarina
  periodo: 2024T3
  motivo: El archivo anual 2024 del formato NLA95FXXIIB no incluye el 3er trimestre.
- municipio: santa-catarina
  periodo: 2026T1
  motivo: Solo se publicó como PDF escaneado (sin datos legibles por máquina).
