# nginx for ¿A dónde va tu dinero? MTY: static files only, runs as an unprivileged user
# with a read-only filesystem (writable paths are all under /tmp, mounted as tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types application/json text/plain text/css application/javascript image/svg+xml;

  server_tokens off;

  # Minimal log without IP addresses or user agents (privacy); Caddy handles abuse control.
  log_format minimo '$time_iso8601 "$request" $status $body_bytes_sent';
  access_log /dev/stdout minimo;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;
  client_max_body_size 1k;
  client_body_buffer_size 1k;
  large_client_header_buffers 4 8k;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Read-only site: only GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # NOTE: add_header is not inherited by locations that declare their own add_header,
    # so every location includes security-headers.conf explicitly.
    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hidden files (.git, .env, …) never get served.
    location ~ /\. {
      return 404;
    }

    # Hashed file names: cache forever.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Data: always revalidate (ETag) so a new quarter shows up right away.
    location /data/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      location ~ /SHA256SUMS$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
      }
      try_files $uri =404;
    }

    # App routes (History API): everything else returns index.html.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
